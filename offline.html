<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Earth Property — Connection Issue</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        font-family: sans-serif;
        background: #f0f2f5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
    }
    .card {
        background: white;
        border-radius: 20px;
        padding: 40px 28px;
        max-width: 340px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }
    .logo-circle {
        width: 72px; height: 72px;
        background: linear-gradient(135deg,#2e7d32,#1b5e20);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 20px;
        font-size: 32px;
    }
    h1 {
        font-size: 18px;
        color: #1a1a1a;
        margin-bottom: 10px;
    }
    p {
        font-size: 13.5px;
        color: #666;
        line-height: 1.6;
        margin-bottom: 24px;
    }
    button {
        background: #2e7d32;
        color: white;
        border: none;
        padding: 13px 28px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        width: 100%;
    }
    button:active { transform: scale(0.97); }
    .hint {
        margin-top: 16px;
        font-size: 11.5px;
        color: #999;
    }
</style>
</head>
<body>
    <div class="card">
        <div class="logo-circle">🌍</div>
        <h1>Connection is slow</h1>
        <p>We couldn't reach The Earth Property right now. This is usually just your internet connection — please check it and try again.</p>
        <button onclick="location.reload()">🔄 Try Again</button>
        <div class="hint">If this keeps happening, try switching between WiFi and mobile data.</div>
    </div>
</body>
</html>
