<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Geohash Backfill (temporary)</title>
<style>
body{font-family:sans-serif;padding:16px;font-size:15px;}
button{width:100%;padding:14px;margin:8px 0;font-size:16px;font-weight:700;border:none;border-radius:10px;background:#2e7d32;color:#fff;}
button:disabled{background:#aaa;}
pre{background:#f4f4f4;padding:10px;border-radius:8px;white-space:pre-wrap;word-break:break-word;font-size:13px;}
</style>
</head>
<body>
<h3>Geohash Backfill</h3>
<div id="status">Checking login...</div>
<button id="scanBtn" disabled>1. Scan properties (read only)</button>
<button id="runBtn" disabled>2. Write geohash</button>
<pre id="log"></pre>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="geo-utils.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyDJ_qGtz1lx_orG4brwp4xUHWdrKctgJ50",authDomain:"earth-properties-c3c56.firebaseapp.com",projectId:"earth-properties-c3c56"});
const db = firebase.firestore();
const auth = firebase.auth();
const ADMIN_UID = "WOY9f67DachGVTuhR4tSJ1BHozx1";
let toUpdate = [];
const logEl = document.getElementById('log');
function log(m){ logEl.textContent += m + '\n'; }

auth.onAuthStateChanged(user => {
  const st = document.getElementById('status');
  if (!user) { st.innerHTML = 'Not logged in. <a href="login.html">Login as admin</a> and come back.'; return; }
  if (user.uid !== ADMIN_UID) { st.textContent = 'This account is not admin.'; return; }
  st.textContent = 'Admin logged in. Ready.';
  document.getElementById('scanBtn').disabled = false;
});

document.getElementById('scanBtn').onclick = async function () {
  this.disabled = true;
  logEl.textContent = '';
  toUpdate = [];
  let total = 0, already = 0;
  const noCoords = [];
  try {
    const snap = await db.collection('properties').get();
    snap.forEach(doc => {
      total++;
      const d = doc.data();
      if (d.latitude != null && d.longitude != null) {
        const lat = Number(d.latitude), lng = Number(d.longitude);
        if (isFinite(lat) && isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180) {
          const gh = TEPGeo.geohashEncode(lat, lng, 9);
          if (d.geohash === gh) already++; else toUpdate.push({ ref: doc.ref, gh: gh });
          return;
        }
      }
      noCoords.push(doc.id + ' | ' + (d.title || 'Untitled'));
    });
    log('Total properties: ' + total);
    log('Already up to date: ' + already);
    log('Need geohash: ' + toUpdate.length);
    log('No valid lat/lng: ' + noCoords.length);
    noCoords.forEach(x => log('  - ' + x));
    document.getElementById('runBtn').disabled = toUpdate.length === 0;
  } catch (e) { log('ERROR: ' + e.message); }
  this.disabled = false;
};

document.getElementById('runBtn').onclick = async function () {
  this.disabled = true;
  let done = 0;
  try {
    for (let i = 0; i < toUpdate.length; i += 400) {
      const batch = db.batch();
      toUpdate.slice(i, i + 400).forEach(x => batch.update(x.ref, { geohash: x.gh }));
      await batch.commit();
      done += Math.min(400, toUpdate.length - i);
      log('Updated ' + done + ' / ' + toUpdate.length);
    }
    log('DONE. Run Scan again to verify.');
    toUpdate = [];
  } catch (e) { log('ERROR: ' + e.message); this.disabled = false; }
};
</script>
</body>
</html>
