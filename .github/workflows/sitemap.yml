name: Update sitemap
on:
  schedule:
    - cron: '0 */6 * * *'
    - cron: '15 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate city pages (daily or manual)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 0 * * *'
        continue-on-error: true
        run: node scripts/generate-city-pages.js
      - run: node scripts/generate-sitemap.js
      - name: Commit if changed
        run: |
          git config user.name "sitemap-bot"
          git config user.email "sitemap-bot@users.noreply.github.com"
          git add sitemap.xml
          if [ -d city ]; then git add city; fi
          git diff --cached --quiet || (git commit -m "Auto-update sitemap" && git push)
