<!DOCTYPE html>
<html>
<head>
    <title>Admin Control - Earth Property</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 10px; }
        header { background: linear-gradient(135deg, #1b5e20, #2e7d32); color: white; padding: 20px; text-align: center; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 15px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .stat-card .number { font-size: 24px; font-weight: 800; color: #2e7d32; }
        .stat-card .label { font-size: 12px; color: #666; margin-top: 5px; text-transform: uppercase; }
        .controls { background: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .search-box { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; font-size: 14px; margin-bottom: 12px; }
        .filter-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 15px; border: 1px solid #ddd; background: white; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s; }
        .filter-btn.active { background: #2e7d32; color: white; border-color: #2e7d32; }
        .card { background: white; margin-bottom: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 5px solid #2e7d32; overflow: hidden; }
        .card-inner { padding: 14px; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; gap: 8px; }
        .card h3 { margin: 0; font-size: 15px; color: #333; flex: 1; line-height: 1.3; }
        .status-badge { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; flex-shrink: 0; }
        .status-active { background: #e8f5e9; color: #2e7d32; }
        .status-expired { background: #ffebee; color: #d32f2f; }
        .card-thumb { width: 100%; height: 160px; object-fit: cover; display: block; border-radius: 10px; margin-bottom: 12px; }
        .card-thumb-placeholder { width: 100%; height: 100px; background: #f0f4f0; border-radius: 10px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 28px; }
        .info-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px; color: #555; flex-wrap: wrap; }
        .info-row i { width: 17px; text-align: center; color: #2e7d32; flex-shrink: 0; font-size: 12px; line-height: 1; }
        .info-row strong { color: #333; }
        .ep-badge { background: #e8f5e9; color: #2e7d32; padding: 1px 6px; border-radius: 8px; font-size: 10px; font-weight: 700; }
        .purpose-badge { background: #f5f5f5; color: #999; padding: 1px 7px; border-radius: 6px; font-size: 11px; }
        .btn-group { margin-top: 12px; padding-top: 12px; border-top: 1px solid #eee; display: flex; gap: 10px; flex-wrap: wrap; }
        button { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 13px; transition: 0.2s; }
        .del-btn { background: #ffebee; color: #d32f2f; }
        .del-btn:hover { background: #d32f2f; color: white; }
        .view-btn { background: #e3f2fd; color: #1976d2; }
        .view-btn:hover { background: #1976d2; color: white; }
        .edit-btn { background: #e8f5e9; color: #2e7d32; }
        .edit-btn:hover { background: #2e7d32; color: white; }
        .copy-btn { background: #fff3e0; color: #f57c00; }
        .copy-btn:hover { background: #f57c00; color: white; }
        .renew-btn { background: #fff3e0; color: #f57c00; }
        .renew-btn:hover { background: #f57c00; color: white; }
        .verify-link { background: linear-gradient(135deg, #ffd700, #ffa500); color: #000; padding: 12px 20px; border-radius: 10px; text-decoration: none; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(255,165,0,0.3); }
        .admin-tabs { display: flex; gap: 10px; background: white; padding: 10px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px 20px; border: 2px solid #e0e0e0; background: white; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.2s; color: #666; }
        .tab-btn.active { background: linear-gradient(135deg, #2e7d32, #1b5e20); color: white; border-color: #2e7d32; }
        .tab-btn:hover:not(.active) { background: #f5f5f5; }
        .admin-section { display: block; }
        .empty-state { text-align: center; padding: 50px 20px; color: #999; }
        .empty-state i { font-size: 60px; margin-bottom: 20px; opacity: 0.3; }
        .loading { text-align: center; padding: 50px; color: #2e7d32; }
        .loading i { font-size: 40px; }
        .load-more-wrap { text-align: center; margin-top: 16px; }
        .load-more-btn { background: #2e7d32; color: white; border: none; padding: 12px 32px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 8px rgba(46,125,50,0.3); flex: unset; width: auto; }
        .load-more-btn:hover { background: #1b5e20; }
        .all-shown { text-align: center; padding: 16px; color: #aaa; font-size: 13px; }
    </style>
</head>
<body>

<header>
    <h2 style="margin:0; display:flex; align-items:center; justify-content:center; gap:10px;">
        <i class="fa fa-shield-halved"></i> Admin Control Panel
    </h2>
</header>

<div class="stats-bar">
    <div class="stat-card">
        <div class="number" id="totalAds">0</div>
        <div class="label">Total Posts</div>
    </div>
    <div class="stat-card">
        <div class="number" id="activeAds" style="color:#2e7d32;">0</div>
        <div class="label">Active</div>
    </div>
    <div class="stat-card">
        <div class="number" id="expiredAds" style="color:#d32f2f;">0</div>
        <div class="label">Expired</div>
    </div>
</div>

<div style="text-align:center; margin:-8px 0 16px;">
    <button id="statsBtn" onclick="showStats()" style="flex:unset; width:auto; padding:8px 18px; background:#e3f2fd; color:#1976d2; border-radius:20px; font-size:12px;">
        <i class="fa fa-chart-simple"></i> Show Stats
    </button>
</div>    
<div style="text-align:center; margin-bottom:20px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
    <a href="admin-verify.html" class="verify-link">
        <i class="fa fa-certificate"></i> Verification Requests
    </a>
    <a href="admin-reports.html" class="verify-link" style="background:linear-gradient(135deg,#d32f2f,#b71c1c); box-shadow:0 4px 15px rgba(211,47,47,0.3);">
        <i class="fa fa-flag"></i> Reports & Chats
    </a>
</div>

<div class="admin-tabs">
    <button class="tab-btn active" onclick="showTab('properties')" id="propertiesTab">
        <i class="fa fa-home"></i> Properties (<span id="propertiesTabCount">0</span>)
    </button>
    <button class="tab-btn" onclick="showTab('feedbacks')" id="feedbacksTab">
        <i class="fa fa-comment-dots"></i> Feedbacks (<span id="feedbacksTabCount">0</span>)
    </button>
    <button class="tab-btn" onclick="showTab('support')" id="supportTab">
        <i class="fa fa-headset"></i> Support (<span id="supportTabCount">0</span>)
    </button>
</div>

<!-- Properties Section -->
<div id="propertiesSection" class="admin-section">
    <div class="controls">
        <input type="text" id="searchBox" class="search-box" placeholder="🔍 TEP ID (e.g. TEP1003) or city / area...">
        <div style="display:flex; gap:10px; margin-bottom:12px;">
            <button class="edit-btn" onclick="runSearch()"><i class="fa fa-search"></i> Search</button>
            <button class="view-btn" onclick="loadLatest()"><i class="fa fa-clock"></i> Load Latest</button>
        </div>
        <div class="filter-row">
            <button class="filter-btn active" onclick="filterByStatus('all', event)">All Posts</button>
            <button class="filter-btn" onclick="filterByStatus('active', event)">Active Only</button>
            <button class="filter-btn" onclick="filterByStatus('expired', event)">Expired Only</button>
        </div>
    </div>
    <div id="list" class="empty-state"></div>
</div>

<!-- Feedbacks Section -->
<div id="feedbacksSection" class="admin-section" style="display:none;">
    <div id="feedbacksList" class="loading">
        <i class="fa fa-database"></i>
        <p>Loading feedbacks...</p>
    </div>
</div>

<!-- Support Section -->
<div id="supportSection" class="admin-section" style="display:none;">
    <div id="supportTicketsList" class="loading">
        <i class="fa fa-database"></i>
        <p>Loading support tickets...</p>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDJ_qGtz1lx_orG4brwp4xUHWdrKctgJ50",
    authDomain: "earth-properties-c3c56.firebaseapp.com",
    projectId: "earth-properties-c3c56"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const ADMIN_UID = "WOY9f67DachGVTuhR4tSJ1BHozx1";

let allProperties = [];
let currentFilter = 'all';
let currentPage = 1;
const PAGE_SIZE = 10;
let feedbacksLoaded = false;
let supportLoaded = false;

const CURRENCY_SYMBOLS = {
    INR:'₹', USD:'$', GBP:'£', EUR:'€', AED:'AED', SAR:'SAR',
    PKR:'Rs', BDT:'৳', SGD:'S$', MYR:'RM', CAD:'C$', AUD:'A$',
    NGN:'₦', GHS:'₵', KES:'KSh', UGX:'USh', RWF:'Fr', NPR:'Rs',
    LKR:'Rs', ZAR:'R', TZS:'TSh', PHP:'₱', IDR:'Rp', THB:'฿',
    VND:'₫', TRY:'₺', BRL:'R$', MXN:'$', KWD:'KD', QAR:'QR',
    OMR:'OMR', BHD:'BD', JOD:'JD', EGP:'£', MAD:'MAD', CNY:'¥',
    JPY:'¥', KRW:'₩', RUB:'₽', CHF:'CHF', SEK:'kr', NOK:'kr'
};

function formatPrice(price, currency) {
    const sym = CURRENCY_SYMBOLS[currency] || currency || '₹';
    const num = Number(price || 0);
    if (currency === 'INR' || !currency) {
        if (num >= 10000000) return `${sym}${(num/10000000).toFixed(1)}Cr`;
        if (num >= 100000) return `${sym}${(num/100000).toFixed(1)}L`;
        return `${sym}${num.toLocaleString('en-IN')}`;
    }
    if (num >= 1000000) return `${sym}${(num/1000000).toFixed(1)}M`;
    if (num >= 1000) return `${sym}${num.toLocaleString()}`;
    return `${sym}${num}`;
}

function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function getThumb(images) {
    if (!images || !images.length) return null;
    const first = images[0];
    if (typeof first === 'string') return first;
    if (first && first.url) return first.url;
    return null;
}

auth.onAuthStateChanged((user) => {
    if (!user || user.uid !== ADMIN_UID) {
        window.location.href = "index.html";
    } else {
        ['totalAds', 'activeAds', 'expiredAds'].forEach(id => document.getElementById(id).innerText = '—');
        renderProperties();
    }
});

// =====================================================
// Properties: nothing loads until the admin asks for it
// =====================================================
const ownerCache = {};
let propState = { items: [], last: null, done: true, loading: false, mode: 'idle', ownerId: null, note: '' };

function toTitleCaseAdmin(s) {
    return String(s || '').trim().toLowerCase().split(' ').filter(Boolean)
        .map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

function newPropState(mode) {
    propState = { items: [], last: null, done: false, loading: false, mode: mode, ownerId: null, note: '' };
    allProperties = propState.items;
    return propState;
}

function mapPropDoc(docSnap) {
    const d = docSnap.data();
    const purpose = d.purpose || 'Sell';
    const days = (purpose === 'Rent' || purpose === 'PG' || purpose === 'CommercialRent') ? 30 : 180;
    const baseDate = d.renewedAt ? d.renewedAt.toDate() : (d.createdAt ? d.createdAt.toDate() : new Date());
    const expDate = new Date(baseDate);
    expDate.setDate(expDate.getDate() + days);
    const info = ownerCache[d.ownerId] || {};
    const fmt = ts => ts.toDate().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    return {
        id: docSnap.id,
        title: d.title || 'Untitled',
        location: d.location || 'N/A',
        country: d.country || '',
        price: d.price || 0,
        currency: d.currency || 'INR',
        phone: d.phone || 'N/A',
        purpose: purpose,
        ownerId: d.ownerId || '',
        ownerName: info.name || '',
        ownerEmail: info.email || '',
        ownerEpId: d.ownerEpId || info.epId || '',
        postDate: d.createdAt ? fmt(d.createdAt) : 'Unknown',
        expiryDate: d.expiryDate ? fmt(d.expiryDate) : 'N/A',
        isExpired: new Date() > expDate,
        isVerified: d.isVerified || false,
        images: d.images || [],
        _sec: d.createdAt ? d.createdAt.seconds : 0
    };
}

async function loadLatest() {
    document.getElementById('searchBox').value = '';
    newPropState('latest');
    await loadPropsPage();
}

async function loadPropsPage() {
    const st = propState;
    if (st.loading || st.done) return;
    st.loading = true;
    renderProperties();
    try {
        let q = db.collection('properties');
        if (st.mode === 'tep') q = q.where('ownerId', '==', st.ownerId);
        q = q.orderBy('createdAt', 'desc').limit(PAGE_SIZE);
        if (st.last) q = q.startAfter(st.last);
        const snap = await q.get();
        if (propState !== st) return;
        snap.docs.forEach(ds => st.items.push(mapPropDoc(ds)));
        if (snap.docs.length) st.last = snap.docs[snap.docs.length - 1];
        st.done = snap.docs.length < PAGE_SIZE;
    } catch (e) {
        console.error('Load error:', e);
        st.done = true;
        st.note = 'Error: ' + e.message;
    }
    st.loading = false;
    renderProperties();
}

async function runSearch() {
    const raw = document.getElementById('searchBox').value.trim();
    if (!raw) { loadLatest(); return; }
    if (raw.length < 2) { alert('Type at least 2 characters.'); return; }
    const compact = raw.replace(/\s+/g, '');
    if (/^tep\d+$/i.test(compact)) await searchByTepId(compact.toUpperCase());
    else await searchByArea(raw);
}

async function searchByTepId(tep) {
    const st = newPropState('tep');
    st.loading = true;
    renderProperties();
    try {
        const u = await db.collection('users').where('epId', '==', tep).limit(1).get();
        if (propState !== st) return;
        if (u.empty) {
            st.loading = false; st.done = true;
            st.note = 'No user found with ID ' + tep;
            renderProperties();
            return;
        }
        const ud = u.docs[0], od = ud.data();
        ownerCache[ud.id] = {
            name: od.displayName || od.name || (od.email || '').split('@')[0] || 'User',
            email: od.email || '',
            epId: od.epId || tep
        };
        st.ownerId = ud.id;
        st.loading = false;
        await loadPropsPage();
    } catch (e) {
        console.error('TEP search error:', e);
        st.loading = false; st.done = true;
        st.note = 'Error: ' + e.message;
        renderProperties();
    }
}

async function searchByArea(term) {
    const st = newPropState('area');
    st.loading = true;
    renderProperties();
    try {
        const cap = term.charAt(0).toUpperCase() + term.slice(1).toLowerCase();
        const variants = [...new Set([term, cap, term.toUpperCase(), toTitleCaseAdmin(term)])];
        const jobs = [];
        ['city', 'location', 'country'].forEach(f => variants.forEach(v =>
            jobs.push(db.collection('properties').where(f, '>=', v).where(f, '<=', v + '\uf8ff').limit(PAGE_SIZE).get())
        ));
        const snaps = await Promise.all(jobs);
        if (propState !== st) return;
        const seen = new Set();
        snaps.forEach(snap => snap.docs.forEach(ds => {
            if (seen.has(ds.id)) return;
            seen.add(ds.id);
            st.items.push(mapPropDoc(ds));
        }));
        st.items.sort((a, b) => b._sec - a._sec);
        st.note = 'First matches for "' + term + '" (up to ' + PAGE_SIZE + ' per field). Be more specific to narrow down.';
    } catch (e) {
        console.error('Area search error:', e);
        st.note = 'Error: ' + e.message;
    }
    st.loading = false;
    st.done = true;
    renderProperties();
}

async function ensureOwner(p) {
    if (p.ownerName || !p.ownerId) return;
    if (!ownerCache[p.ownerId]) {
        try {
            const od = await db.collection('users').doc(p.ownerId).get();
            if (od.exists) {
                const o = od.data();
                ownerCache[p.ownerId] = {
                    name: o.displayName || o.name || (o.email || '').split('@')[0] || 'User',
                    email: o.email || '',
                    epId: o.epId || ''
                };
            }
        } catch (e) { console.error('Owner fetch error:', e); }
    }
    const info = ownerCache[p.ownerId];
    if (info) {
        p.ownerName = info.name;
        p.ownerEmail = info.email;
        p.ownerEpId = p.ownerEpId || info.epId;
    }
}

async function showStats() {
    const btn = document.getElementById('statsBtn');
    btn.disabled = true;
    btn.textContent = 'Counting...';
    try {
        const col = db.collection('properties');
        const [t, a, e] = await Promise.all([
            col.count().get(),
            col.where('isExpired', '==', false).count().get(),
            col.where('isExpired', '==', true).count().get()
        ]);
        document.getElementById('totalAds').innerText = t.data().count;
        document.getElementById('activeAds').innerText = a.data().count;
        document.getElementById('expiredAds').innerText = e.data().count;
        btn.innerHTML = '<i class="fa fa-rotate"></i> Refresh Stats';
    } catch (err) {
        alert('Could not count: ' + err.message);
        btn.innerHTML = '<i class="fa fa-chart-simple"></i> Show Stats';
    }
    btn.disabled = false;
} 

function showTab(tab) {
    document.querySelectorAll('.admin-section').forEach(s => s.style.display = 'none');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

    if (tab === 'properties') {
        document.getElementById('propertiesSection').style.display = 'block';
        document.getElementById('propertiesTab').classList.add('active');
    } else if (tab === 'feedbacks') {
        document.getElementById('feedbacksSection').style.display = 'block';
        document.getElementById('feedbacksTab').classList.add('active');
        if (!feedbacksLoaded) { loadFeedbacks(); feedbacksLoaded = true; }
    } else if (tab === 'support') {
        document.getElementById('supportSection').style.display = 'block';
        document.getElementById('supportTab').classList.add('active');
        if (!supportLoaded) { loadSupportTickets(); supportLoaded = true; }
    }
}

function loadFeedbacks() {
    db.collection('feedbacks').onSnapshot((snapshot) => {
        const container = document.getElementById('feedbacksList');
        document.getElementById('feedbacksTabCount').innerText = snapshot.size;

        if (snapshot.empty) {
            container.innerHTML = `<div class="empty-state"><i class="fa fa-comment-slash"></i><h3>No Feedbacks Yet</h3><p>Users haven't submitted any feedback.</p></div>`;
            return;
        }

        let html = '';
        snapshot.forEach(docSnap => {
            const f = docSnap.data();
            const id = docSnap.id;
            const date = f.createdAt ? f.createdAt.toDate().toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' }) : 'Just now';
            const stars = '★'.repeat(f.rating || 0) + '☆'.repeat(5 - (f.rating || 0));

            html += `
                <div class="card">
                    <div class="card-inner">
                        <div class="card-header">
                            <div>
                                <div style="color:#ffd700; font-size:18px; margin-bottom:5px;">${stars}</div>
                                <h3>${escapeHtml(f.userName || 'Unknown')}</h3>
                                <div style="font-size:12px; color:#999;">${escapeHtml(f.userEmail || '')}</div>
                            </div>
                            <span class="status-badge ${f.status === 'resolved' ? 'status-active' : 'status-expired'}">
                                ${f.status === 'resolved' ? 'RESOLVED' : 'PENDING'}
                            </span>
                        </div>
                        <div class="info-row"><i class="fa fa-tag"></i><span>${escapeHtml(f.category || 'General')}</span></div>
                        <div class="info-row"><i class="fa fa-message"></i><span>${escapeHtml(f.feedbackText || '')}</span></div>
                        <div class="info-row"><i class="fa fa-calendar"></i><span>${date}</span></div>
                        <div class="btn-group">
                            ${f.status !== 'resolved' ?
                                `<button class="edit-btn" onclick="markFeedbackResolved('${id}')"><i class="fa fa-check"></i> Mark Resolved</button>` :
                                `<button class="view-btn" disabled style="opacity:0.5;cursor:not-allowed;"><i class="fa fa-check-circle"></i> Resolved</button>`
                            }
                            <button class="del-btn" onclick="deleteFeedback('${id}')"><i class="fa fa-trash"></i> Delete</button>
                        </div>
                    </div>
                </div>`;
        });
        container.innerHTML = html;
    });
}

function loadSupportTickets() {
    db.collection('support_tickets').onSnapshot((snapshot) => {
        const container = document.getElementById('supportTicketsList');
        document.getElementById('supportTabCount').innerText = snapshot.size;

        if (snapshot.empty) {
            container.innerHTML = `<div class="empty-state"><i class="fa fa-ticket"></i><h3>No Support Tickets</h3><p>No support tickets submitted.</p></div>`;
            return;
        }

        let html = '';
        snapshot.forEach(docSnap => {
            const t = docSnap.data();
            const id = docSnap.id;
            const date = t.createdAt ? t.createdAt.toDate().toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' }) : 'Just now';
            const priorityColor = t.priority === 'high' ? '#d32f2f' : t.priority === 'medium' ? '#f57c00' : '#2e7d32';

            html += `
                <div class="card">
                    <div class="card-inner">
                        <div class="card-header">
                            <div>
                                <h3>${escapeHtml(t.subject || 'No subject')}</h3>
                                <div style="font-size:12px; color:#999;">${escapeHtml(t.userName || 'Unknown')} (${escapeHtml(t.userEmail || '')})</div>
                            </div>
                            <span class="status-badge" style="background:${priorityColor}20; color:${priorityColor};">
                                ${(t.priority || 'medium').toUpperCase()} PRIORITY
                            </span>
                        </div>
                        <div class="info-row"><i class="fa fa-tag"></i><span>${escapeHtml(t.category || 'Other')}</span></div>
                        <div class="info-row"><i class="fa fa-message"></i><span>${escapeHtml(t.description || '')}</span></div>
                        <div class="info-row"><i class="fa fa-calendar"></i><span>${date}</span></div>
                        <div class="info-row"><i class="fa fa-signal"></i><span>Status: ${(t.status || 'open').toUpperCase()}</span></div>
                        ${(t.replies || []).length > 0 ? `<div class="info-row"><i class="fa fa-comments"></i><span>${t.replies.length} ${t.replies.length === 1 ? 'Reply' : 'Replies'}</span></div>` : ''}
                        <div class="btn-group">
                            ${t.status !== 'closed' ?
                                `<button class="edit-btn" onclick="closeTicket('${id}')"><i class="fa fa-check"></i> Close Ticket</button>` :
                                `<button class="view-btn" disabled style="opacity:0.5;cursor:not-allowed;"><i class="fa fa-check-circle"></i> Closed</button>`
                            }
                            <button class="del-btn" onclick="deleteTicket('${id}')"><i class="fa fa-trash"></i> Delete</button>
                        </div>
                    </div>
                </div>`;
        });
        container.innerHTML = html;
    });
}

function renderProperties() {
    const list = document.getElementById("list");
    const st = propState;
    document.getElementById('propertiesTabCount').innerText = st.items.length;

    if (st.mode === 'idle') {
        list.className = 'empty-state';
        list.innerHTML = `<i class="fa fa-database"></i><h3>Properties not loaded</h3><p>Tap "Load Latest" for the newest ${PAGE_SIZE}, or search by TEP ID / city / area.</p>`;
        return;
    }
    if (st.loading && st.items.length === 0) {
        list.className = 'loading';
        list.innerHTML = '<i class="fa fa-spinner fa-spin"></i><p>Loading...</p>';
        return;
    }

    const filtered = st.items.filter(p => {
        if (currentFilter === 'active' && p.isExpired) return false;
        if (currentFilter === 'expired' && !p.isExpired) return false;
        return true;
    });

    const noteHtml = st.note ? `<div class="all-shown">${escapeHtml(st.note)}</div>` : '';
    const footer = !st.done
        ? `<div class="load-more-wrap"><button class="load-more-btn" onclick="loadMoreProperties()" ${st.loading ? 'disabled' : ''}>${st.loading ? 'Loading...' : '<i class="fa fa-chevron-down"></i> Load More (' + st.items.length + ' loaded)'}</button></div>`
        : `<div class="all-shown">✓ ${st.items.length} listing${st.items.length !== 1 ? 's' : ''} loaded</div>`;

    if (filtered.length === 0) {
        list.className = 'empty-state';
        list.innerHTML = `<i class="fa fa-search"></i><h3>No Results</h3><p>${st.done ? 'Nothing found.' : 'Load more to see further results.'}</p>` + noteHtml + footer;
        return;
    }

    list.className = '';
    const cardsHtml = filtered.map(p => {
        const thumb = getThumb(p.images);
        const imgHtml = thumb
            ? `<img src="${escapeHtml(thumb)}" alt="property photo" class="card-thumb" loading="lazy">`
            : `<div class="card-thumb-placeholder">🏠</div>`;

        return `
        <div class="card" style="border-left-color: ${p.isExpired ? '#d32f2f' : '#2e7d32'};">
            <div class="card-inner">
                ${imgHtml}
                <div class="card-header">
                    <h3>
                        ${p.isVerified ? '<i class="fa fa-check-circle" style="color:#1da1f2; margin-right:4px;"></i>' : ''}
                        ${escapeHtml(p.title)}
                    </h3>
                    <span class="status-badge ${p.isExpired ? 'status-expired' : 'status-active'}">
                        ${p.isExpired ? 'EXPIRED' : 'ACTIVE'}
                    </span>
                </div>

                <div class="info-row">
                    <i class="fa fa-location-dot"></i>
                    <span>${escapeHtml(p.location)}${p.country ? `, ${escapeHtml(p.country)}` : ''}</span>
                </div>

                <div class="info-row">
                    <i class="fa fa-tag"></i>
                    <strong style="color:#1b5e20;">${formatPrice(p.price, p.currency)}</strong>
                    <span class="purpose-badge">${escapeHtml(p.purpose)}</span>
                </div>

                <div class="info-row">
                    <i class="fa fa-phone"></i>
                    <span>${escapeHtml(p.phone)}</span>
                </div>

                <div class="info-row">
                    <i class="fa fa-user"></i>
                    ${p.ownerName ? `<strong>${escapeHtml(p.ownerName)}</strong>` : '<span style="color:#999;">Owner: tap View</span>'}
                    ${p.ownerEpId ? `<span class="ep-badge">${escapeHtml(p.ownerEpId)}</span>` : ''}
                    ${p.ownerEmail ? `<span style="color:#aaa; font-size:11px;">${escapeHtml(p.ownerEmail)}</span>` : ''}
                </div>

                <div class="info-row" style="font-size:12px; color:#999;">
                    <i class="fa fa-calendar"></i>
                    <span>Posted: ${p.postDate}</span>
                    ${p.expiryDate !== 'N/A' ? `<span>· Expires: ${p.expiryDate}</span>` : ''}
                </div>

                <div class="btn-group">
                    <button class="view-btn" onclick="viewProperty('${p.id}')">
                        <i class="fa fa-eye"></i> View
                    </button>
                    <button class="edit-btn" onclick="editProperty('${p.id}')">
                        <i class="fa fa-edit"></i> Edit
                    </button>
                    <button class="copy-btn" onclick="copyPropertyId('${p.id}')">
                        <i class="fa fa-copy"></i> ID
                    </button>
                    ${p.isExpired ? `<button class="renew-btn" onclick="adminRenewAd('${p.id}', '${p.purpose}', this)">
                        <i class="fa fa-rotate-right"></i> Renew
                    </button>` : ''}
                    <button class="del-btn" onclick="deletePost('${p.id}')">
                        <i class="fa fa-trash-alt"></i> Delete
                    </button>
                </div>
            </div>
        </div>`;
    }).join('');

    list.innerHTML = cardsHtml + noteHtml + footer;
}

function loadMoreProperties() { loadPropsPage(); }

function filterByStatus(status, event) {
    currentFilter = status;
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    if (event && event.target) event.target.classList.add('active');
    renderProperties();
}

document.getElementById('searchBox').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') runSearch();
});

function copyPropertyId(id) {
    navigator.clipboard.writeText(id).then(() => {
        alert('Property ID copied!\n\n' + id);
    }).catch(() => {
        prompt('Copy this Property ID:', id);
    });
}

async function viewProperty(id) {
    const p = allProperties.find(x => x.id === id);
    if (!p) return;
    await ensureOwner(p);
    const thumb = getThumb(p.images);
    const imgHtml = thumb
        ? `<img src="${escapeHtml(thumb)}" alt="property" style="width:100%;height:200px;object-fit:cover;border-radius:10px;margin-bottom:20px;display:block;">`
        : '';

    const modal = document.createElement('div');
    modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;';

    modal.innerHTML = `
        <div style="background:white;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;border-radius:15px;box-shadow:0 10px 50px rgba(0,0,0,0.5);">
            <div style="padding:20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:white;z-index:1;">
                <h2 style="margin:0;font-size:18px;">Property Details</h2>
                <button onclick="this.closest('.admin-modal').remove()" style="background:none;border:none;font-size:24px;cursor:pointer;color:#999;flex:unset;width:auto;padding:0;">&times;</button>
            </div>
            <div style="padding:20px;">
                ${imgHtml}
                <h3 style="color:#2e7d32;margin-top:0;">${escapeHtml(p.title)}</h3>
                <div style="display:grid;gap:15px;margin-top:20px;">
                    <div><strong style="color:#666;font-size:12px;text-transform:uppercase;">Status</strong>
                        <div style="margin-top:5px;"><span class="status-badge ${p.isExpired ? 'status-expired' : 'status-active'}">${p.isExpired ? 'EXPIRED' : 'ACTIVE'}</span></div>
                    </div>
                    <div><strong style="color:#666;font-size:12px;text-transform:uppercase;">Price</strong>
                        <div style="font-size:20px;font-weight:800;color:#2e7d32;margin-top:5px;">${formatPrice(p.price, p.currency)}</div>
                        <div style="color:#999;font-size:13px;">Purpose: ${escapeHtml(p.purpose)}</div>
                    </div>
                    <div><strong style="color:#666;font-size:12px;text-transform:uppercase;">Location</strong>
                        <div style="margin-top:5px;">${escapeHtml(p.location)}${p.country ? `, ${escapeHtml(p.country)}` : ''}</div>
                    </div>
                    <div><strong style="color:#666;font-size:12px;text-transform:uppercase;">Contact</strong>
                        <div style="margin-top:5px;">${escapeHtml(p.phone)}</div>
                    </div>
                    <div><strong style="color:#666;font-size:12px;text-transform:uppercase;">Owner</strong>
                        <div style="margin-top:5px;">
                            <div style="font-weight:600;">${escapeHtml(p.ownerName)}</div>
                            ${p.ownerEpId ? `<div style="color:#2e7d32;font-size:12px;font-weight:700;">${escapeHtml(p.ownerEpId)}</div>` : ''}
                            ${p.ownerEmail ? `<div style="color:#999;font-size:13px;">${escapeHtml(p.ownerEmail)}</div>` : ''}
                        </div>
                    </div>
                    <div><strong style="color:#666;font-size:12px;text-transform:uppercase;">Dates</strong>
                        <div style="margin-top:5px;font-size:13px;">
                            <div>Posted: ${p.postDate}</div>
                            ${p.expiryDate !== 'N/A' ? `<div style="color:#999;">Expires: ${p.expiryDate}</div>` : ''}
                        </div>
                    </div>
                    <div><strong style="color:#666;font-size:12px;text-transform:uppercase;">Property ID</strong>
                        <div style="margin-top:5px;font-family:monospace;background:#f5f5f5;padding:8px;border-radius:5px;font-size:12px;">${p.id}</div>
                    </div>
                </div>
                <div style="margin-top:30px;display:flex;gap:10px;">
                    <button onclick="editProperty('${p.id}')" style="flex:1;background:#2e7d32;color:white;border:none;padding:12px;border-radius:8px;font-weight:700;cursor:pointer;">
                        <i class="fa fa-edit"></i> Edit Property
                    </button>
                    <button onclick="this.closest('.admin-modal').remove()" style="background:#f5f5f5;color:#666;border:none;padding:12px 20px;border-radius:8px;font-weight:700;cursor:pointer;flex:unset;width:auto;">
                        Close
                    </button>
                </div>
            </div>
        </div>`;

    modal.classList.add('admin-modal');
    document.body.appendChild(modal);
    modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
}

function editProperty(id) {
    const modal = document.querySelector('.admin-modal');
    if (modal) modal.remove();
    sessionStorage.setItem('adminEdit', 'true');
    window.open(`add-property.html?edit=${id}`, '_blank');
}

async function deletePost(id) {
    const item = propState.items.find(p => p.id === id);
    const title = item ? item.title : '';
    if (!confirm(`Delete this property permanently?\n\nTitle: ${title}\n\nThis cannot be undone.`)) return;
    try {
        await db.collection("properties").doc(id).delete();
        const i = propState.items.findIndex(p => p.id === id);
        if (i >= 0) propState.items.splice(i, 1);
        renderProperties();
        alert("Property deleted successfully!");
    } catch (e) {
        alert("Error: " + e.message);
    }
}

async function adminRenewAd(id, purpose, btn) {
    if (!confirm("Renew this ad for another full period?")) return;
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i>';

    try {
        const days = (purpose === 'Rent' || purpose === 'PG' || purpose === 'CommercialRent') ? 30 : 180;
        const newExpiry = new Date();
        newExpiry.setDate(newExpiry.getDate() + days);

        await db.collection("properties").doc(id).update({
            isExpired: false,
            renewedAt: firebase.firestore.FieldValue.serverTimestamp(),
            expiryDate: firebase.firestore.Timestamp.fromDate(newExpiry)
        });

        const p = propState.items.find(x => x.id === id);
        if (p) {
            p.isExpired = false;
            p.expiryDate = newExpiry.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
        }
        renderProperties();
        setTimeout(() => alert("Ad renewed successfully!"), 100);
    } catch (e) {
        alert("Error: " + e.message);
        btn.disabled = false;
        btn.innerHTML = originalText;
    }
}

async function markFeedbackResolved(id) {
    if (!confirm('Mark this feedback as resolved?')) return;
    try {
        await db.collection('feedbacks').doc(id).update({
            status: 'resolved',
            resolvedAt: firebase.firestore.FieldValue.serverTimestamp(),
            resolvedBy: auth.currentUser.uid
        });
        alert('Feedback marked as resolved!');
    } catch (e) { alert('Error: ' + e.message); }
}

async function deleteFeedback(id) {
    if (!confirm('Delete this feedback permanently?')) return;
    try {
        await db.collection('feedbacks').doc(id).delete();
        alert('Feedback deleted!');
    } catch (e) { alert('Error: ' + e.message); }
}

async function closeTicket(id) {
    if (!confirm('Close this support ticket?')) return;
    try {
        await db.collection('support_tickets').doc(id).update({
            status: 'closed',
            lastReply: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert('Ticket closed!');
    } catch (e) { alert('Error: ' + e.message); }
}

async function deleteTicket(id) {
    if (!confirm('Delete this support ticket permanently?')) return;
    try {
        await db.collection('support_tickets').doc(id).delete();
        alert('Ticket deleted!');
    } catch (e) { alert('Error: ' + e.message); }
}
</script>
