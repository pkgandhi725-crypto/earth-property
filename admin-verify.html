<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Earth Property Verification</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .card { background: white; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-left: 5px solid #2e7d32; position: relative; }
        .doc-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin: 15px 0; }
        .doc-grid img { width: 100%; height: 220px; object-fit: cover; border-radius: 10px; border: 1px solid #ddd; cursor: pointer; }
        .btn-group { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-approve { background: #2e7d32; color: white; }
        .btn-reject { background: #fff1f0; color: #cf1322; border: 1px solid #ffa39e; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .status-badge { position: absolute; top: 20px; right: 20px; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; background: #e8f5e9; color: #2e7d32; }
        .doc-label { font-size: 12px; color: #888; font-weight: 600; text-align: center; margin-top: 5px; }
        .user-info { background: #f1f8e9; border-radius: 10px; padding: 12px 14px; margin: 12px 0; font-size: 14px; color: #333; }
        .user-info div { margin-bottom: 6px; word-break: break-all; }
        .user-info div:last-child { margin-bottom: 0; }
        .user-info i { color: #2e7d32; width: 18px; }
        .user-info b { color: #555; }
    </style>
</head>
<body>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="color:#2e7d32;"><i class="fa fa-user-shield"></i> Pending Requests</h2>
        <button onclick="location.reload()" class="btn" style="flex:none; background:#fff; border:1px solid #ddd; padding:8px 15px;">Refresh</button>
    </div>
    <div id="requestList">Loading requests...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { 
    getFirestore, collection, doc, setDoc, addDoc, updateDoc, getDoc,
    onSnapshot, query, where, writeBatch, getDocs, serverTimestamp 
} from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

const firebaseConfig = { 
    apiKey: "AIzaSyDJ_qGtz1lx_orG4brwp4xUHWdrKctgJ50", 
    authDomain: "earth-properties-c3c56.firebaseapp.com", 
    projectId: "earth-properties-c3c56" 
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const ADMIN_UID = "WOY9f67DachGVTuhR4tSJ1BHozx1";

// HTML escape (user ka data safely dikhane ke liye)
function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
}

onAuthStateChanged(auth, (user) => {
    if (!user || user.uid !== ADMIN_UID) {
        alert("Restricted Access: Admin Only!");
        window.location.href = "index.html";
    } else {
        loadRequests();
    }
});

// Request mein fields na ho (purani requests) to users doc se le aao
async function getUserDetails(uid, d) {
    let name = d.displayName || '';
    let email = d.email || '';
    let epId = d.epId || '';

    if (!name || !email || !epId) {
        try {
            const uSnap = await getDoc(doc(db, "users", uid));
            if (uSnap.exists()) {
                const u = uSnap.data();
                name = name || u.displayName || '';
                email = email || u.email || '';
                epId = epId || u.epId || '';
            }
        } catch (e) {
            console.warn("User fetch failed for", uid, e);
        }
    }
    return { name, email, epId };
}

function loadRequests() {
    const q = query(collection(db, "verification_requests"), where("status", "==", "pending"));
    
    onSnapshot(q, async (snap) => {
        const list = document.getElementById('requestList');

        if (snap.empty) {
            list.innerHTML = '<div class="card">No pending requests found.</div>';
            return;
        }

        const items = await Promise.all(snap.docs.map(async (docSnap) => {
            const d = docSnap.data();
            const info = await getUserDetails(docSnap.id, d);
            return { uid: docSnap.id, d, info };
        }));

        list.innerHTML = '';

        items.forEach(({ uid, d, info }) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <span class="status-badge">PENDING</span>
                <h3>${esc(d.businessName || 'Unnamed Business')}</h3>

                <div class="user-info">
                    <div><i class="fa fa-user"></i> <b>Name:</b> ${esc(info.name || '—')}</div>
                    <div><i class="fa fa-envelope"></i> <b>Email:</b> ${esc(info.email || '—')}</div>
                    <div><i class="fa fa-hashtag"></i> <b>TEP ID:</b> ${esc(info.epId || '—')}</div>
                    <div><i class="fa fa-id-card"></i> <b>ID Type:</b> ${esc(d.idType || '—')}</div>
                </div>

                <p style="font-size:12px; color:#666;">User ID: ${esc(uid)}</p>
                <p style="font-size:12px; color:#999;">
                    Submitted: ${d.submittedAt ? d.submittedAt.toDate().toLocaleString('en-IN') : '—'}
                </p>

                <div class="doc-grid">
                    <div>
                        <img src="${esc(d.idProofUrl)}" onclick="window.open(this.src)" title="Click to view full image">
                        <div class="doc-label">📄 ID Proof</div>
                    </div>

                    <!-- PAYMENT BOX — HIDDEN (payment system aane par uncomment karna)
                    <div>
                        <img src="${esc(d.paymentUrl)}" onclick="window.open(this.src)" title="Click to view full image">
                        <div class="doc-label">💳 Payment Screenshot</div>
                    </div>
                    -->
                </div>

                <div class="btn-group">
                    <button class="btn btn-approve" id="app-${uid}">
                        <i class="fa fa-check"></i> APPROVE DEALER
                    </button>
                    <button class="btn btn-reject" id="rej-${uid}">
                        <i class="fa fa-times"></i> REJECT
                    </button>
                </div>
            `;

            list.appendChild(card);

            document.getElementById(`app-${uid}`).onclick = () => approveDealer(uid, d.businessName);
            document.getElementById(`rej-${uid}`).onclick = () => rejectDealer(uid, d.businessName);
        });
    }, (err) => {
        console.error("Firestore Error:", err);
        alert("Permission Denied. Check Firestore Rules!");
    });
}

async function approveDealer(uid, bizName) {
    if(!confirm(`Are you sure you want to approve "${bizName}"?`)) return;
    
    const appBtn = document.getElementById(`app-${uid}`);
    const rejBtn = document.getElementById(`rej-${uid}`);
    appBtn.disabled = true; 
    rejBtn.disabled = true;
    appBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Processing...';

    try {
        // Step 1: Update User Profile
        await setDoc(doc(db, "users", uid), { 
            isVerified: true, 
            premiumDealer: true, 
            businessName: bizName,
            verifiedAt: serverTimestamp()
        }, { merge: true });

        // Step 2: Update Request Status
        await updateDoc(doc(db, "verification_requests", uid), { 
            status: "approved", 
            approvedAt: serverTimestamp() 
        });

        // Step 3: Update Properties
        const propsSnap = await getDocs(query(collection(db, "properties"), where("ownerId", "==", uid)));
        if (!propsSnap.empty) {
            const batch = writeBatch(db);
            propsSnap.forEach(p => {
                batch.update(p.ref, { 
                    isVerified: true, 
                    dealerName: bizName 
                });
            });
            await batch.commit();
        }

        // Step 4: Save Approval Notification for User
        await addDoc(collection(db, "notifications"), {
            recipientId: uid,
            type: "verification_approved",
            title: "🎉 Verification Approved!",
            message: `Congratulations! Your dealer verification for "${bizName}" has been approved. You are now a Verified Premium Dealer.`,
            read: false,
            createdAt: serverTimestamp()
        });

        alert(`✅ Success! "${bizName}" is now a Verified Dealer.`);
    } catch(e) { 
        console.error("Approve Error:", e);
        alert("Error: " + e.message); 
        appBtn.disabled = false; 
        rejBtn.disabled = false;
        appBtn.innerHTML = '<i class="fa fa-check"></i> APPROVE DEALER';
    }
}

async function rejectDealer(uid, bizName) {
    const reason = prompt(`Enter Rejection Reason for "${bizName}":\n(User will see this message)`);
    if(!reason || reason.trim() === '') return;

    try {
        // Step 1: Update Request Status with Reason
        await updateDoc(doc(db, "verification_requests", uid), { 
            status: "rejected", 
            rejectionReason: reason.trim(),
            rejectedAt: serverTimestamp()
        });

        // Step 2: Save Rejection Notification for User
        await addDoc(collection(db, "notifications"), {
            recipientId: uid,
            type: "verification_rejected",
            title: "❌ Verification Rejected",
            message: `Your verification request was rejected.\n\nReason: ${reason.trim()}\n\nPlease resubmit with correct documents.`,
            read: false,
            createdAt: serverTimestamp()
        });

        alert(`Request rejected. User has been notified.`);
    } catch(e) { 
        console.error("Reject Error:", e);
        alert(e.message); 
    }
}
</script>
</body>
</html>
